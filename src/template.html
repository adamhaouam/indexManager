<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Index Manager (Dev)</title>
	</head>
	<body>
		<header>
			<h1>Index Manager</h1>
		</header>
		<div id="content">
			<div class="table">
				<div class="lvlTitle">Level 1</div>
				<div class="lvlTitle">Level 2</div>
				<div class="lvlTitle">Level 3</div>
				<div id="lv1List">
					<div class="listing">
						<h3>Template lv1 item</h3>
						<div class="icons">
							<span class="editIcon">Edit</span
							><span class="editIcon">Del</span>
						</div>
					</div>
				</div>
				<div id="lv2List">
					<div class="listing">
						<h3>Template lv2 item</h3>
						<div class="icons">
							<span class="editIcon">Edit</span
							><span class="editIcon">Del</span>
						</div>
					</div>
				</div>
				<div id="lv3List">
					<div class="listing">
						<h3>Template lv3 item</h3>
						<div class="icons">
							<span class="editIcon">Edit</span
							><span class="editIcon">Del</span>
						</div>
					</div>
				</div>
			</div>
			<div class="settings">
				<h3>Settings:</h3>
				<input type="text" id="searchBar" name="searchBar" />
				<button id="search">Search</button>
				<label for="showDeleted">Show Deleted:</label>
				<input type="checkbox" id="showDeleted" name="showDeleted">
                <button id="refresh">Refresh Data</button>
			</div>
		</div>
		<dialog id="basicMenu">
			<h2 id="basicMenuTitle">Create Item</h2>
			<form id="basicMenuForm">
				<label for="basicListingName">Listing Name:</label>
				<input
					type="text"
					id="basicListingName"
					name="basicListingName"
					required
				/>
				<button id="basicSubmit" type="button">Create Listing</button>
				<button id="basicEdit" type="button">Save Listing</button>
			</form>
		</dialog>

		<dialog id="advMenu">
			<h2 id="advMenuTitle">New listing</h2>
			<form id="advMenuForm">
				<label for="advListingName">Listing Name:</label>
				<input
					type="text"
					id="advListingName"
					name="advListingName"
					required
				/>
				<label for="listingDesc">Description:</label>
				<textarea id="advListingDesc" name="listingDesc"></textarea>
				<label for="advListingStatus">Status:</label>
				<select id="advListingStatus" name="listingStatus">
					<option value="notStarted">Not Started</option>
					<option value="inProgress">In progress</option>
					<option value="draftCompleted">Draft Completed</option>
					<option value="reviewed">Reviewed</option>
					<option value="sentBack">Sent Back</option>
					<option value="approved">Approved</option>
					<option value="completed">Completed</option>
				</select>
				<button id="advSubmit" type="button">Create Listing</button>
				<button id="advEdit" type="button">Save Listing</button>
			</form>
		</dialog>

		<footer>
			<span
				>Created by Adam Haouam -<a href="https://github.com/adamhaouam"
					>GitHub Page</a
				></span
			>
            <span id="dataState"> - (Dev)</span>
		</footer>
	</body>
</html>
