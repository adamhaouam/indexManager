<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
	</head>
	<body>
		<header>
			<h1>To Do List</h1>
		</header>
		<div id="content">
			<div class="lv1Title">Level 1</div>
			<div class="lv2Title">Level 2</div>
			<div class="lv3Title">Level 3</div>
			<div id="lv1List">
				<div class="listing">
					<h3>Template lv1 item</h3>
					<div class="icons">
						<span class="editIcon">Edit</span
						><span class="editIcon">Del</span>
					</div>
				</div>
			</div>
			<div id="lv2List">
				<div class="listing">
					<h3>Template lv2 item</h3>
					<div class="icons">
						<span class="editIcon">Edit</span
						><span class="editIcon">Del</span>
					</div>
				</div>
			</div>
			<div id="lv3List">
				<div class="listing">
					<h3>Template lv3 item</h3>
					<div class="icons">
						<span class="editIcon">Edit</span
						><span class="editIcon">Del</span>
					</div>
				</div>
			</div>
		</div>
        <button id="saveData">Save Data</button>

		<dialog id="basicMenu">
			<h2 id="basicMenuTitle">New Item (Level 1, 2)</h2>
			<form id="basicMenuForm">
				<label for="basicListingName">Listing Name:</label>
				<input
					type="text"
					id="basicListingName"
					name="basicListingName"
					required
				/>
				<button id="basicSubmit" type="button">Create Listing</button>
				<button id="basicEdit" type="button">Save Listing</button>
			</form>
		</dialog>

		<dialog id="advMenu">
			<h2 id="advMenuTitle">New listing</h2>
			<form id="advMenuForm">
				<label for="listingName">Listing Name:</label>
				<input
					type="text"
					id="listingName"
					name="listingName"
					required
				/>
				<label for="listingDesc">Description:</label>
				<textarea id="listingDesc" name="listingDesc"></textarea>
				<label for="listingStatus">Status:</label>
				<select id="listingStatus" name="listingStatus">
					<option value="new">New</option>
					<option value="progress">In-progress</option>
					<option value="done">Completed</option>
				</select>
			</form>
		</dialog>

		<footer>
			<span
				>Created by Adam Haouam for
				<a
					href="https://www.theodinproject.com/lessons/node-path-javascript-todo-list"
					>The Odin Project</a
				></span
			>
			<span><a href="https://github.com/adamhaouam">GitHub Page</a></span>
		</footer>
	</body>
</html>
